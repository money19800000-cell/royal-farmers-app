<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/mobile-fix.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/mobile.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  input:focus { outline:none; border-color:#38B2AC !important; box-shadow:0 0 0 3px rgba(56,178,172,.15); }
</style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; font-family:'Plus Jakarta Sans','Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif; background:linear-gradient(135deg,#38B2AC 0%,#4FD1C5 55%,#81E6D9 100%); position:relative; overflow:hidden;">

  <div style="position:absolute; top:-120px; right:-120px; width:420px; height:420px; border-radius:50%; background:rgba(255,255,255,0.05);"></div>
  <div style="position:absolute; bottom:-160px; left:-100px; width:380px; height:380px; border-radius:50%; background:rgba(255,255,255,0.04);"></div>

  <div style="width:100%; max-width:420px; background:#fff; border-radius:20px; box-shadow:0 24px 60px rgba(10,20,60,0.35); padding:40px 38px 34px; position:relative;">
    <div style="display:flex; align-items:center; gap:11px; margin-bottom:6px;">
      <span style="width:38px; height:38px; border-radius:11px; background:linear-gradient(310deg,#4FD1C5,#38B2AC); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px;">JF</span>
      <div>
        <div style="font-size:16px; font-weight:800; color:#2D3748;">IB 期权月收益计划</div>
        <div style="font-size:11px; color:#A0AEC0; font-weight:600; letter-spacing:.04em;">Interactive Brokers · 投资人门户</div>
      </div>
    </div>

    <div style="font-size:22px; font-weight:800; color:#2D3748; margin:24px 0 4px;">投资人登录</div>
    <div style="font-size:13px; color:#A0AEC0; margin-bottom:24px;">请输入您的投资人编码与密码查看持仓详情</div>

    <label style="display:block; font-size:12px; font-weight:700; color:#4A5568; margin-bottom:7px;">投资人编码</label>
    <input id="ib-code" placeholder="A2501" autocapitalize="characters" onKeyDown="{{ onKey }}" style="width:100%; font-size:15px; font-family:inherit; color:#2D3748; padding:13px 15px; border:1px solid #EDF2F7; border-radius:11px; margin-bottom:18px; transition:.15s;"/>

    <label style="display:block; font-size:12px; font-weight:700; color:#4A5568; margin-bottom:7px;">登录密码</label>
    <input id="ib-pwd" type="password" placeholder="请输入密码" onKeyDown="{{ onKey }}" style="width:100%; font-size:15px; font-family:inherit; color:#2D3748; padding:13px 15px; border:1px solid #EDF2F7; border-radius:11px; margin-bottom:10px; transition:.15s;"/>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
      <label style="display:flex; align-items:center; gap:7px; font-size:12px; color:#718096; cursor:pointer;"><input type="checkbox" defaultChecked="checked" style="width:14px; height:14px; accent-color:#38B2AC;"/>记住此设备</label>
      <span style="font-size:12px; color:#38B2AC; font-weight:600; cursor:pointer;">忘记密码？</span>
    </div>

    <div style="min-height:18px; margin:0 0 8px; font-size:12.5px; color:#C53030; font-weight:600; text-align:center;">{{ err }}</div>

    <button onClick="{{ onLogin }}" style="width:100%; border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700; color:#fff; padding:14px; border-radius:12px; background:linear-gradient(310deg,#4FD1C5,#38B2AC); box-shadow:0 8px 20px rgba(56,178,172,0.32);">登录账户</button>

    <div style="display:flex; align-items:center; gap:9px; margin-top:22px; padding-top:18px; border-top:1px solid #EDF2F7;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span style="font-size:11px; color:#A0AEC0; line-height:1.5;">受银行级加密保护 · 仅家族内部投资人可访问</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { err: '' };
  SALT = 'jf-ibfund-2026::';
  // 投资人编码 → SHA-256(SALT + 编码 + ':' + 密码)。源码仅存哈希，不含明文密码。
  AUTH = {"A2501":"5f1c0632ab33dc25243c7e397cbf1c413054187382acd99010451a726b980de7","A2502":"339847118dfc505a13088e33345ace3ff7a9b52346b2f8eaa3b0c618ada4f82d","A2503":"e1aedacb9d811f1eac132086c18237c702d5338b0f6cb699d4f49c318f638247","A2504":"fc256d540fab0d4b1923f50adaaebe046b76c7570a5161b28e37303b19b89acc","A2505":"5a97082914c7d3a2db0fdc270e37a6c4c031d125c01f4196e754860e24c45c51","A2506":"fcaa637b262ac0ff8fbe00ff98a7f02ec110ed7f984c2c5ce9799706034ac3ca","A2507":"738c71e94a83b5d5d4c2a46f2c89e94992e907579bc64a5024e18ed1553a359a","A2601":"f0a561045b340b0c67931e535488fb2d5396d1bdcc67e6177199f402d15409af","A2025":"30f73acbd7174598d9cb2cc442c632e7045fe5d554f0bd752f0afbfec4011836"};

  // 纯 JS SHA-256（局域网 http 下无 crypto.subtle，故不依赖它）
  sha256 = (ascii) => {
    function rr(n,x){return (x>>>n)|(x<<(32-n));}
    var m=Math.pow,M=m(2,32),i,j,result='';
    var words=[],asciiBitLength=ascii.length*8;
    var hash=this.sha256.h=this.sha256.h||[],k=this.sha256.k=this.sha256.k||[],primeCounter=k.length;
    var isComposite={};
    for(var candidate=2;primeCounter<64;candidate++){
      if(!isComposite[candidate]){
        for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
        hash[primeCounter]=(m(candidate,.5)*M)|0;
        k[primeCounter++]=(m(candidate,1/3)*M)|0;
      }
    }
    ascii+='\x80';
    while(ascii.length%64-56)ascii+='\x00';
    for(i=0;i<ascii.length;i++){
      j=ascii.charCodeAt(i);
      if(j>>8)return;
      words[i>>2]|=j<<((3-i)%4)*8;
    }
    words[words.length]=(asciiBitLength/M)|0;
    words[words.length]=asciiBitLength;
    for(j=0;j<words.length;){
      var w=words.slice(j,j+=16),oldHash=hash;
      hash=hash.slice(0,8);
      for(i=0;i<64;i++){
        var w15=w[i-15],w2=w[i-2];
        var a=hash[0],e=hash[4];
        var temp1=hash[7]+(rr(6,e)^rr(11,e)^rr(25,e))+((e&hash[5])^(~e&hash[6]))+k[i]
          +(w[i]=i<16?w[i]:(w[i-16]+(rr(7,w15)^rr(18,w15)^(w15>>>3))+w[i-7]+(rr(17,w2)^rr(19,w2)^(w2>>>10)))|0);
        var temp2=(rr(2,a)^rr(13,a)^rr(22,a))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
        hash=[(temp1+temp2)|0].concat(hash);
        hash[4]=(hash[4]+temp1)|0;
      }
      for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
    }
    for(i=0;i<8;i++)
      for(j=3;j+1;j--){
        var b=(hash[i]>>(j*8))&255;
        result+=((b<16)?0:'')+b.toString(16);
      }
    return result;
  };

  submit = () => {
    var cEl = document.getElementById('ib-code'), pEl = document.getElementById('ib-pwd');
    var code = ((cEl && cEl.value) || '').trim().toUpperCase();
    var pwd  = (pEl && pEl.value) || '';
    if (!code || !pwd) { this.setState({ err: '请输入投资人编码和密码' }); return; }
    if (!this.AUTH[code]) { this.setState({ err: '投资人编码不存在' }); return; }
    if (this.sha256(this.SALT + code + ':' + pwd) === this.AUTH[code]) {
      try { sessionStorage.setItem('ib_auth_code', code); } catch (e) {}
      window.location.href = 'ibfund.dc.html';
    } else {
      this.setState({ err: '密码错误，请重试' });
    }
  };
  onLogin = () => this.submit();
  onKey = (e) => { if (e.key === 'Enter') this.submit(); };
  renderVals() { return { onLogin: this.onLogin, onKey: this.onKey, err: this.state.err }; }
}
</script>
</body>
</html>
